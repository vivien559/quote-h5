<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>设备配置报价</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:#eef2f8;min-height:100vh;color:#1c2333}
button{font-family:inherit}
.gate{display:flex;align-items:center;justify-content:center;min-height:100vh}
.gcard{background:#fff;width:390px;max-width:92vw;border-radius:16px;box-shadow:0 12px 40px rgba(15,35,95,.14);padding:36px 32px;text-align:center}
.glogo{height:46px;max-width:220px;display:block;margin:0 auto 16px}
.gcard h2{font-size:18px}
.gsub{font-size:12.5px;color:#8a94a8;margin:8px 0 20px}
.gcard input{width:100%;padding:12px 14px;border:1.5px solid #e3e9f2;border-radius:10px;font-size:14px;outline:none;box-shadow:inset 0 1px 3px rgba(15,35,95,.06)}
.gcard input:focus{border-color:#1a66ff}
.gerr{color:#e5484d;font-size:12.5px;min-height:18px;margin-top:8px}
.gcard button{width:100%;margin-top:12px;padding:12px;background:linear-gradient(180deg,#2f74ff,#1a66ff);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:14px 12px 92px}
.hd{background:linear-gradient(135deg,#1a66ff,#4a90ff);color:#fff;border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hd .co{font-size:16px;font-weight:700}
.hd .tt{font-size:11.5px;opacity:.85;margin-top:3px}
.sec{background:#fff;border-radius:12px;margin-top:12px;padding:14px;box-shadow:0 4px 14px rgba(15,35,95,.05)}
.sec-hd{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:700;margin-bottom:10px}
.sec-hd .tip{font-size:11px;color:#8a94a8;font-weight:400}
.acard{border:1.5px solid #e3e9f2;border-radius:10px;padding:12px;margin-bottom:10px;position:relative;cursor:pointer;display:flex;gap:10px}
.acard:last-child{margin-bottom:0}
.athumb{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none}
.aci{flex:1;min-width:0}
.dimg{margin-top:12px;background:#f7f9fc;border:1px solid #eef1f6;border-radius:12px;overflow:hidden}
.dimg img{width:100%;display:block}
.dimg.ph{height:210px;display:flex;align-items:center;justify-content:center}
.dimg.ph span{font-size:12.5px;color:#b6bfd0}
.prow-kv{display:flex;justify-content:space-between;gap:12px;padding:9px 2px;border-bottom:1px solid #f0f3f8;font-size:13px}
.prow-kv:last-child{border-bottom:none}
.pk{color:#8a94a8;flex:none}
.pv{font-weight:600;text-align:right}
.prod{position:relative;background:#fff;border:1.5px solid #e3e9f2;border-radius:10px;padding:12px;margin:0 2px 10px;cursor:pointer}
.prod:last-of-type{margin-bottom:0}
.prod.on{border-color:#1a66ff;background:#f5f9ff;box-shadow:0 2px 8px rgba(26,102,255,.12)}
.prod .pm{font-size:15px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.prod .pp{color:#0f4fd6;font-weight:700;white-space:nowrap}
.prod .pd{font-size:11.5px;color:#5b667a;margin-top:5px;line-height:1.55}
.catsec{padding:0;overflow:hidden}
.catsec .sec-hd{padding:14px 14px 10px;margin-bottom:0}
.catwrap{display:flex;height:430px}
.catrail{width:104px;flex:none;background:#f7f9fc;overflow-y:auto;border-right:1px solid #eef1f6}
.catitem{padding:14px 10px;font-size:12.5px;color:#5b667a;cursor:pointer;position:relative;line-height:1.4}
.catitem.on{background:#fff;color:#0f4fd6;font-weight:700}
.catitem.on::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;background:#1a66ff;border-radius:2px}
.catprods{flex:1;overflow-y:auto;padding:10px 12px}
.acard.sel{border-color:#1a66ff;background:#f5f9ff;box-shadow:0 2px 8px rgba(26,102,255,.12)}
.seltag{position:absolute;top:-9px;right:10px;background:#1a66ff;color:#fff;font-size:11px;padding:1px 8px;border-radius:999px}
.addbtn{position:absolute;top:8px;right:12px;width:28px;height:28px;border-radius:50%;background:#1a66ff;color:#fff;font-size:20px;font-weight:700;line-height:28px;text-align:center;cursor:pointer;box-shadow:0 2px 6px rgba(26,102,255,.4);transition:transform .1s}
.addbtn:active{transform:scale(.9)}
.acard .m,.prod .pm{padding-right:40px}
.acard .m{font-size:15px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.acard .p{color:#0f4fd6;font-weight:700;white-space:nowrap}
.acard .d{font-size:11.5px;color:#5b667a;margin-top:5px;line-height:1.55}
.prow{border-bottom:1px solid #f0f3f8;padding:10px 0;cursor:pointer}
.prow:last-child{border-bottom:none}
.prow .t{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:600}
.code{color:#8a94a8;font-size:11px;font-weight:400;margin-left:4px}
.sub{font-size:12.5px;color:#0f4fd6;font-weight:700;white-space:nowrap}
.pfoot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.ptip{font-size:11.5px;color:#8a94a8}
.specbtn{border:1.5px solid #1a66ff;background:#fff;color:#0f4fd6;border-radius:999px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 1px 3px rgba(26,102,255,.15)}
.sopt{border:1.5px solid #e3e9f2;border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.sopt.on{border-color:#1a66ff;background:#f5f9ff;box-shadow:0 2px 8px rgba(26,102,255,.12)}
.sopt .st{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:700}
.sopt .sp{color:#0f4fd6;font-weight:700;white-space:nowrap}
.sopt .sd{font-size:11.5px;color:#5b667a;margin-top:5px;line-height:1.55}
.nav{display:flex;align-items:center;gap:12px;padding:2px 2px 12px}
.navbk{border:none;background:#fff;box-shadow:0 1px 4px rgba(15,35,95,.16);width:34px;height:34px;border-radius:50%;font-size:20px;color:#1c2333;cursor:pointer;line-height:1;flex:none}
.navt{font-size:16.5px;font-weight:800}
.dsec-hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dname{font-size:18px;font-weight:800}
.dprice{font-size:18px;font-weight:800;color:#0f4fd6;font-variant-numeric:tabular-nums}
.dpre{white-space:pre-wrap;font-size:13px;color:#3c465a;line-height:1.9;font-family:inherit}
.bottombar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e3e9f2;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:9;box-shadow:0 -4px 14px rgba(15,35,95,.06)}
.bb-l .n{font-size:11px;color:#8a94a8}
.bb-l .v{font-size:17px;font-weight:800;color:#0f4fd6;font-variant-numeric:tabular-nums}
.btnp{background:linear-gradient(180deg,#2f74ff,#1a66ff);color:#fff;border:none;border-radius:10px;padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 3px 8px rgba(26,102,255,.3)}
.btns{background:#fff;border:1.5px solid #e3e9f2;color:#1c2333;border-radius:10px;padding:10px 16px;font-size:13px;cursor:pointer}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{background:#f5f8fd;padding:8px 10px;border:1px solid #e3e9f2;color:#5b667a;font-size:12px;text-align:left;white-space:nowrap}
td{padding:8px 10px;border:1px solid #eef1f6;white-space:nowrap}
td.txt{white-space:normal}
.num{text-align:right;font-variant-numeric:tabular-nums}
.total td{background:#eef4ff;font-weight:700;color:#0f4fd6}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:#5b667a;margin-bottom:10px}
.btnrow{display:flex;gap:10px;margin-top:14px}
.btnrow .btnp,.btnrow .btns{flex:1;text-align:center}
.hidden{display:none}
</style>
</head>

  var a = acById(cur.ac);

  var p = pOf(a);
  return hdHtml() +
    '<div class="nav"><button class="navbk" id="bkBtn">‹</button><span class="navt">' + esc(a.model) + '</span></div>' +
    imgHtml(a.img) +
    '<div class="sec"><div class="dsec-hd"><span class="dname">' + esc(a.model) + '</span>' + (p != null ? '<span class="dprice">' + fmtBare(p) + '</span>' : '') + '</div></div>' +
    '<div class="sec"><div class="sec-hd"><span>参数详情</span></div>' + paramsHtml(a.params) + '</div>' +
    '<div class="bottombar"><div class="bb-l"><div class="n">' + esc(PL()) + '</div><div class="v">' + (p != null ? fmtBare(p) : '—') + '</div></div><button class="btnp" id="acPick">' + (on ? '取消选择' : '选择该机型') + '</button></div>';
}
function prodDetailHtml() {
  var pt = D.pt[cur.c];
  var o = pt.options[cur.o];
  var chosen = sel.parts[pt.id] || [];
  var on = chosen.indexOf(o.id) >= 0;
  var p = pOf(o);
  return hdHtml() +
    '<div class="nav"><button class="navbk" id="bkBtn">‹</button><span class="navt">' + esc(o.label) + '</span></div>' +
    imgHtml(o.img) +
    '<div class="sec"><div class="dsec-hd"><span class="dname">' + esc(o.label) + '</span>' + (p != null ? '<span class="dprice">' + fmtBare(p) + '</span>' : '') + '</div>' +
      '<div class="ptip" style="margin-top:6px">' + esc(pt.name) + (pt.code ? ' · ' + esc(pt.code) : '') + '</div></div>' +
    '<div class="sec"><div class="sec-hd"><span>参数详情</span></div>' + paramsHtml(o.params) + '</div>' +
    '<div class="bottombar"><div class="bb-l"><div class="n">' + esc(PL()) + '</div><div class="v">' + (p != null ? fmtBare(p) : '—') + '</div></div><button class="btnp" id="prodPick">' + (on ? '取消选择' : '选择该产品') + '</button></div>';
}
function quoteText() {
  var q = calcQuote();
  return [D.company + ' 设备配置报价单',
    '报价日期：' + today(), '主设备：' + q.model, '价格基准：' + D.fieldLabels.join(' / '),
    '----------------------------------------'
  ].concat(
    q.rows.map(function (r, i) {
      return (i + 1) + '. ' + r.name + ' / ' + r.spec + '（' + (r.code || '—') + '） ' +
        D.fields.map(function (f, k) { return D.fieldLabels[k] + ' ' + fmtBare(r.prices ? r.prices[f] : null); }).join('，');
    }),
    ['----------------------------------------', '合计：' + D.fields.map(function (f, k) { return D.fieldLabels[k] + ' ' + fmtBare(q.totals[f]); }).join('，')]
  ).join('\n');
}
function copyQuote() {
  var txt = quoteText();
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); alert('已复制到剪贴板'); } catch (e) { alert('复制失败，请手动选择文本'); }
    ta.remove();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function () { alert('已复制到剪贴板'); }, fallback);
  } else fallback();
}
function open() {
  var p = document.getElementById('pwd').value;
  if (h(p) !== P.pwdHash) { document.getElementById('err').textContent = '访问密码错误'; return; }
  var t = dec(P.data, p);
  var d;
  try { d = JSON.parse(t); } catch (e) { document.getElementById('err').textContent = '数据解析失败'; return; }
  D = d;
  render();
}
document.getElementById('go').onclick = open;
document.getElementById('pwd').addEventListener('keydown', function (e) { if (e.key === 'Enter') open(); });
})();
</script>
</body>
</html>
